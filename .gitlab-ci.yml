stages:
  - test

test:
  image: python:3.9
  stage: test
  script:
    # Instalar as dependências do projeto
    - pip install robotframework robotframework-seleniumlibrary webdriver-manager requests
    # Instalar o ChromeDriver com o webdriver-manager
    - python -c "from webdriver_manager.chrome import ChromeDriverManager; ChromeDriverManager().install()"
    # Verificar se o chromedriver foi instalado corretamente e está no PATH
    - ls /root/.cache/selenium/chromedriver/
    # Rodar os testes Robot Framework
    - robot test/usuario.robot
  only:
    - developer  # Executar apenas na branch 'developer'
