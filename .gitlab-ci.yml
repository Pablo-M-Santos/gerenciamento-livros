stages:
  - install
  - test
  - build

# Job para o frontend
frontend_install:
  stage: install
  image: node:14
  script:
    - cd frontend
    - npm install

frontend_lint:
  stage: test
  image: node:14
  script:
    - cd frontend
    - npm run lint

frontend_test:
  stage: test
  image: node:14
  script:
    - cd frontend
    - npm test

frontend_build:
  stage: build
  image: node:14
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

# Job para o backend
backend_build:
  stage: build
  image: maven:3.8.1-jdk-11
  script:
    - cd backend/LocadoraLivro
    - mvn clean install
  artifacts:
    paths:
      - backend/LocadoraLivro/target/