stages:
  - install
  - test
  - build

# Job para instalar dependências do frontend
frontend_install:
  stage: install
  image: node:14
  script:
    - cd frontend
    - npm install

# Job para executar testes do Robot Framework
frontend_test:
  stage: test
  image: python:3.9
  services:
    - selenium/standalone-chrome
  script:
    - cd test
    - mkdir -p ../results
    - pip install -r requirements.txt
    - robot --outputdir=../results usuario.robot

  artifacts:
    paths:
      - results/
    when: always

# Job para buildar o frontend
frontend_build:
  stage: build
  image: node:14
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
