stages:
  - test

# Job para executar os testes do Robot Framework
frontend_test:
  stage: test
  image: python:3.9
  services:
    - selenium/standalone-chrome
  variables:
    BASE_URL: http://localhost:9000
    DISPLAY: :99
  before_script:
    # Instalar dependências necessárias para o Selenium funcionar corretamente
    - apt-get update && apt-get install -y chromium chromium-driver
    - pip install robotframework selenium robotframework-seleniumlibrary webdriver-manager robotframework-requests
  script:
    - cd test  # Navega até a pasta onde o arquivo usuario.robot está localizado
    - python -m webdriver_manager.chrome --install  # Instala o WebDriver para o Chrome
    - export DISPLAY=:99  # Configura a variável DISPLAY para o modo headless
    - export GOOGLE_CHROME_BIN=/usr/bin/chromium  # Especifica o caminho para o binário do Chromium
    - robot --outputdir=results usuario.robot  # Executa os testes no arquivo usuario.robot
  artifacts:
    paths:
      - results/
    when: always
