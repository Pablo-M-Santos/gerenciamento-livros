stages:
  - test

test:
  stage: test
  image: python:3.9-slim
  services:
    - name: selenium/standalone-firefox
      alias: selenium
  script:
    - apt-get update && apt-get install -y wget
    - apt-get install -y firefox-esr  # Instalando o Firefox
    - pip install --upgrade pip  # Atualizando pip para garantir compatibilidade
    - pip install robotframework robotframework-seleniumlibrary webdriver-manager  # Instalando dependências
    - python -c "from webdriver_manager.firefox import GeckoDriverManager; GeckoDriverManager().install()"  # Instalando o geckodriver
    - robot test/test.robot  # Rodando os testes
  only:
    - developer  # Limitar a execução apenas para a branch 'developer'
