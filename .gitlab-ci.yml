stages:
  - install
  - test
  - build

# Job para o frontend
frontend_install:
  stage: install
  image: node:14
  script:
    - cd frontend
    - npm install

frontend_lint:
  stage: test
  image: node:14
  script:
    - cd frontend
    - npm install
    - npm install -g eslint
    - npm run lint

frontend_test:
  stage: test
  image: python:3.9  # Usando uma imagem Python para o Robot Framework
  script:
    - pip install robotframework selenium requests xmlrunner  # Instala as bibliotecas necessárias para os testes
    - ls -la test  # Lista os arquivos na pasta 'test' para garantir que o caminho está correto
    - robot --outputdir=results test/*.robot  # Executa todos os testes .robot dentro da pasta 'test'

frontend_build:
  stage: build
  image: node:14
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
