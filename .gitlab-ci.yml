stages:
  - install
  - test
  - build

# Job para instalar dependências do frontend
frontend_install:
  stage: install
  image: node:14
  script:
    - cd frontend
    - npm install

# Job para executar testes do Robot Framework
frontend_test:
  stage: test
  image: python:3.9
  services:
    - selenium/standalone-chrome
  variables:
    BASE_URL: http://localhost:9000
  before_script:
    - apt-get update && apt-get install -y chromium chromium-driver
  script:
    - pip install robotframework
    - pip install robotframework-requests
    - pip install robotframework-seleniumlibrary
    - robot --outputdir=results test/*.robot
  artifacts:
    paths:
      - results/
    when: always

# Job para buildar o frontend
frontend_build:
  stage: build
  image: node:14
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
