stages:
  - install
  - test
  - build

# Job para o frontend
frontend_install:
  stage: install
  image: node:14
  script:
    - cd frontend
    - npm install

frontend_lint:
  stage: test
  image: node:14
  script:
    - cd frontend
    - npm install
    - npm install -g eslint
    - npm run lint

frontend_test:
  stage: test
  image: python:3.9  
  script:
    - cd test  
    - pip install robotframework
    - robot --outputdir=results tests.robot 

frontend_build:
  stage: build
  image: node:14
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
