stages:
  - install
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip_cache"
  PATH: "/usr/bin:$PATH"
  CHROME_DRIVER_VERSION: "latest" # Use uma versão específica, se necessário

cache:
  paths:
    - .pip_cache/

before_script:
  - apt-get update && apt-get install -y python3 python3-pip chromium-driver chromium
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install --cache-dir $PIP_CACHE_DIR -r requirements.txt
  - export PATH=$PATH:/usr/lib/chromium/

install_dependencies:
  stage: install
  script:
    - echo "Instalando dependências..."
    - apt-get update && apt-get install -y chromium chromium-driver
    - pip install --cache-dir $PIP_CACHE_DIR -r requirements.txt
  only:
    - main # Rodar apenas na branch `main`

frontend_test:
  stage: test
  script:
    - echo "Executando testes com Robot Framework..."
    - mkdir -p results
    - robot --outputdir=results test/*.robot
  artifacts:
    paths:
      - results/
    when: always
  only:
    - merge_requests # Rodar apenas em MRs
  tags:
    - docker # Certifique-se de que os runners tenham suporte a Docker

# Exemplo para rodar no Docker
docker_tests:
  stage: test
  image: python:3.10
  services:
    - selenium/standalone-chrome:latest
  script:
    - pip install -r requirements.txt
    - robot --outputdir=results test/*.robot
  artifacts:
    paths:
      - results/
    when: always
