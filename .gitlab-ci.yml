image: docker:latest

services:
  - docker:dind

stages:
  - build
  - test
  - deploy

build-job:
  stage: build
  script:
    - echo "Construindo a aplicação..."
    - docker build -t locadora-docker .

test-job:
  stage: test
  script:
    - echo "Executando testes..."
    - docker run locadora-docker test

deploy-job:
  stage: deploy
  script:
    - echo "Realizando o deploy..."
    - docker push locadora-docker
  environment:
    name: production