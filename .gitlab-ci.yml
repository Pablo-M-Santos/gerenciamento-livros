stages:
  - install
  - test
  - build

# Job para instalar dependências do frontend
frontend_install:
  stage: install
  image: node:14
  script:
    - cd frontend
    - npm install
# Job para executar testes do Robot Framework
frontend_test:
  stage: test
  image: python:3.9
  services:
    - selenium/standalone-chrome
  variables:
    BASE_URL: http://localhost:9000
  before_script:
    - apt-get update && apt-get install -y chromium chromium-driver
    - pip install -r requirements.txt  # Instalar dependências do Robot Framework
    - CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
    - CHROMEDRIVER_VERSION=$(chromedriver --version)
    - wget -N https://chromedriver.storage.googleapis.com/114.0.5735.90/chromedriver_linux64.zip
    - unzip chromedriver_linux64.zip
    - mv chromedriver /usr/local/bin/
    - chmod +x /usr/local/bin/chromedriver
  script:
    - cd test
    - robot --outputdir=results test/*.robot
  artifacts:
    paths:
      - results/
    when: always

# Job para buildar o frontend
frontend_build:
  stage: build
  image: node:14
  script:
    - cd frontend
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
