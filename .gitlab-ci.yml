stages:
  - test

test_front:
  stage: test
  image: python:3.9
  before_script:
    - pip install robotframework
    - pip install robotframework-seleniumlibrary
    - apt-get update && apt-get install -y chromium-driver
  script:
    - robot -d results robot.robot
  artifacts:
    paths:
      - results/
  only:
    - developer
