services:
  locadora-db-pablo:
    image: postgres:15
    container_name: postgres_db_pablo
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_pablo:/var/lib/postgresql/data

  locadora-backend-pablo:
    build: ./backend/
    image: locadora-back-pablo
    container_name: locadora-back-pablo-${CI_COMMIT_REF_SLUG:-unknown}
    depends_on:
      - locadora-db-pablo
    ports:
      - "${BACK_PORT}:8040"
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

  locadora-frontend-pablo:
    build: 
      context: ./frontend
      args:
        VITE_BASE_URL: ${VITE_BASE_URL}
    image: locadora-front-pablo
    container_name: locadora-front-pablo-${CI_COMMIT_REF_SLUG:-unknown}
    depends_on:
      - locadora-backend-pablo
    ports:
      - "${FRONT_PORT}:80"

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.67.0.0/16

volumes:
  postgres_data_pablo:
